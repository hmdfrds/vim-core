[package]
name = "vim-core"
version = "0.7.1"
edition = "2021"
description = "Pure Rust Vim engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hmdfrds/vim-core"
homepage = "https://github.com/hmdfrds/vim-core"
keywords = ["vim", "editor", "text-editor", "modal", "neovim"]
categories = ["text-editors", "algorithms"]

[dependencies]
# Core derive
smallvec.workspace = true
thiserror = "1.0"
derive_more = "0.99"
smart-default = "0.7"
strum = { version = "0.26", features = ["derive"] }
bitflags.workspace = true
nonmax = "0.5"

# Text processing
unicode-segmentation = "1.10"
unicode-width = "0.1"
memchr = { workspace = true }
compact_str.workspace = true

# Collections
ahash = { workspace = true }
arrayvec = "0.7"

# Utilities
cfg-if = "1.0"
static_assertions.workspace = true

# Optional — serde ecosystem (feature-gated)
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tracing = { workspace = true, optional = true }



# Persistent B+ tree text buffer.
vim-text = { path = "../vim-text" }
vim-regex = { path = "../vim-regex" }



[dev-dependencies]
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vim-test = { path = "../vim-test" }

[features]
default = ["std"]
# `vim-core` is std-only.
std = []
logging = ["tracing", "std"]

testing = []    # Exposes test_utils module for integration tests and downstream crates
# Serde serialization for VimState persistence (session save/restore).
# Enables serde derives on all state types and their transitive dependencies.
serde = ["dep:serde", "dep:serde_json", "compact_str/serde", "ahash/serde", "smallvec/serde", "vim-regex/serde"]
# Engine observability: structured TraceEvents emitted into a Vec on EngineColdState.
# When off, all tracing code compiles away to nothing.
engine-tracing = []



